name: Docker Image Publish Matrix (All)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only, publish nothing to GHCR (like a pull request)"
        type: boolean
        default: false
      full_matrix:
        description: "Dry runs and pull requests are fast by default (no emulated alpine builds); true runs the complete matrix"
        type: boolean
        default: false
  workflow_call:
    inputs:
      tcw_commit_hash:
        type: string
      dry_run:
        type: boolean
        default: false
      full_matrix:
        type: boolean
        default: false

  push:
    branches:
      - master
      - develop
    tags:
      - tc_nightly*
      - tc_v*.*.*
      # release candidates: images only (rc, rc0.7.1, ...), no release, never latest; cut from develop
      - rc_v*.*.*
  pull_request:
    branches:
      - master
      - develop

concurrency:
  # release candidates share one group: rc / rc0.x.y are moving tags, runs must not overlap; dry runs have their own
  group: ${{ github.workflow }}-${{ startsWith(github.ref_name, 'rc_v') && 'release-candidates' || github.ref }}${{ inputs.dry_run == true && '-dry' || '' }}
  cancel-in-progress: ${{ github.ref_type == 'branch' || github.event_name == 'pull_request' }}

jobs:
  test_commit_hash:
    runs-on: ubuntu-latest
    outputs:
      # fast: pull requests and dry runs (they publish nothing); a real publish always builds the full matrix
      fast: ${{ (github.event_name == 'pull_request' || inputs.dry_run == true) && inputs.full_matrix != true }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ inputs.tcw_commit_hash }}

      # a release candidate is cut from develop: refuse an rc_ tag whose commit is not reachable from it
      - name: Check that the release candidate tag is on develop
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'rc_v') }}
        run: |
          git fetch --no-tags --unshallow origin develop || git fetch --no-tags origin develop
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME points at $commit, which is not on develop. Release candidates are cut from develop."
            exit 1
          fi

      - name: Verify commit hash
        if: ${{ inputs.tcw_commit_hash != '' }}
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          if [ "$COMMIT_HASH" != "${{ inputs.tcw_commit_hash }}" ]; then
            echo "Error: Checked out commit hash ($COMMIT_HASH) does not match the expected hash (${{ inputs.tcw_commit_hash }})."
            exit 1
          else
            echo "Commit hash verified: $COMMIT_HASH"
          fi

  ubuntu:
    needs: test_commit_hash
    uses: ./.github/workflows/publish_docker_matrix_base.yml
    with:
      system: "ubuntu"
      dockerfile: "DockerfileUbuntu"
      platforms: '["linux/amd64", "linux/arm/v7", "linux/arm64/v8", "linux/ppc64le", "linux/s390x"]'
      primary_image: true
      error_platforms: '["linux/s390x"]'
      # arm64 builds with AddressSanitizer (native runner, see base workflow).
      noasan_fallback_platforms: '["linux/arm/v7", "linux/ppc64le"]'
      dry_run: ${{ inputs.dry_run == true }}
      tcw_commit_hash: ${{ inputs.tcw_commit_hash }}
  debian:
    needs: test_commit_hash
    uses: ./.github/workflows/publish_docker_matrix_base.yml
    with:
      system: "debian"
      dockerfile: "DockerfileDebian"
      platforms: '["linux/amd64", "linux/arm/v7", "linux/arm64/v8", "linux/i386", "linux/ppc64le", "linux/s390x"]'
      primary_image: false
      error_platforms: '["linux/s390x"]'
      # arm64 builds with AddressSanitizer (native runner, see base workflow).
      noasan_fallback_platforms: '["linux/arm/v7", "linux/ppc64le"]'
      dry_run: ${{ inputs.dry_run == true }}
      tcw_commit_hash: ${{ inputs.tcw_commit_hash }}
  alpine:
    needs: test_commit_hash
    uses: ./.github/workflows/publish_docker_matrix_base.yml
    with:
      system: "alpine"
      dockerfile: "DockerfileAlpine"
      platforms: ${{ needs.test_commit_hash.outputs.fast == 'true' && '["linux/amd64", "linux/arm/v6", "linux/arm/v7", "linux/arm64/v8", "linux/386"]' || '["linux/amd64", "linux/arm/v6", "linux/arm/v7", "linux/arm64/v8", "linux/ppc64le", "linux/s390x", "linux/386"]' }}
      primary_image: false
      error_platforms: "[]"
      noasan_fallback_platforms: "[]"
      dry_run: ${{ inputs.dry_run == true }}
      tcw_commit_hash: ${{ inputs.tcw_commit_hash }}

  ubuntuAsanTest:
    needs: test_commit_hash
    uses: ./.github/workflows/publish_docker_matrix_base.yml
    with:
      system: "ubuntuAsanTest"
      dockerfile: "DockerfileUbuntu"
      # ASAN test of the native 32-bit ARM binary. arm64 is promoted to the main build; ppc64le is gone here:
      # ASAN cannot run under QEMU (it aborts at start), so that job could never succeed.
      platforms: '["linux/arm/v7"]'
      primary_image: false
      error_platforms: '["linux/arm/v7"]'
      noasan_fallback_platforms: "[]"
      skip_empty_merge: true
      dry_run: ${{ inputs.dry_run == true }}
      tcw_commit_hash: ${{ inputs.tcw_commit_hash }}
  debianAsanTest:
    needs: test_commit_hash
    uses: ./.github/workflows/publish_docker_matrix_base.yml
    with:
      system: "debianAsanTest"
      dockerfile: "DockerfileDebian"
      # ASAN test of the native 32-bit ARM binary. arm64 is promoted to the main build; ppc64le is gone here:
      # ASAN cannot run under QEMU (it aborts at start), so that job could never succeed.
      platforms: '["linux/arm/v7"]'
      primary_image: false
      error_platforms: '["linux/arm/v7"]'
      noasan_fallback_platforms: "[]"
      skip_empty_merge: true
      dry_run: ${{ inputs.dry_run == true }}
      tcw_commit_hash: ${{ inputs.tcw_commit_hash }}